name: Elixir GitHub Actions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1.18", otp: "27"}
          - {elixir: "1.18.4", otp: "28.0"}
          - {elixir: "1.19", otp: "28"}
          - {elixir: "1.20", otp: "29"}

    env:
      MIX_ENV: test
      CRAWLY_E2E_BASE_URL: http://localhost:8080
      # So Erlang prints UTF-8 (e.g. "£" in the e2e crawl report)
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v7

      - name: Start the books site for the e2e test
        run: docker compose -f test/e2e/docker-compose.yml up -d --build --wait

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - run: mix deps.get
      - run: mix compile
      - run: mix test

      # Crawls the local books.toscrape.com copy, see test/e2e/books_crawl_test.exs.
      # Runs even if the unit tests failed, so both results are visible.
      - name: End-to-end crawl
        if: ${{ !cancelled() }}
        run: mix test --only e2e

      - name: Books site logs
        if: failure()
        run: docker compose -f test/e2e/docker-compose.yml logs

      - name: Check formatting
        if: matrix.elixir == '1.20'
        run: mix format --check-formatted

