name: Elixir GitHub Actions

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {elixir: "1.18", otp: "27"}
          - {elixir: "1.18.4", otp: "28.0"}
          - {elixir: "1.19", otp: "28"}
          - {elixir: "1.20", otp: "29"}

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - run: mix deps.get
      - run: mix compile
      - run: mix test

      - name: Check formatting
        if: matrix.elixir == '1.20'
        run: mix format --check-formatted
