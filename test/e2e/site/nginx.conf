server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve /catalogue/foo/ as /catalogue/foo/index.html, 404 otherwise.
    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Cover images are not stored in the repo; every one is the same placeholder.
    location /media/ {
        try_files /placeholder.png =404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
